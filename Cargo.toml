[package]
name = "ib"
version = "0.1.0"
edition = "2021"
description = "Rust and SQLite simulation trading platform for paper trading and strategy development"

[lib]
name = "ib"
path = "src/lib.rs"

[[bin]]
name = "ib"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Error plumbing is the main design constraint here: data-layer functions
# return `String`/`rusqlite::Error`, HTTP handlers own the status codes.
# `Box<Response>` was the only way to smuggle a status through the data
# layer and it tripped `result_large_err`; `ApiError` replaces it.
all = { level = "warn", priority = -1 }

[dependencies]
argon2 = "0.5"
axum = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["v4"] }

# Integration tests drive the real router over a real TCP socket, so they need
# the same async runtime the server uses. No HTTP client crate: the test
# client is ~40 lines of TcpStream, which keeps the dependency surface small.
[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util", "signal", "time"] }
# tests/api.rs opens the scratch database directly to plant expired sessions
# and stale verification rows that cannot be produced through the API, and
# digests a token to build a row whose hash the server will match.
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
# Cross-crate inlining matters here: the fixed-point Decimal <-> i64 scaling
# and JSON encoding of the overview payload are the hot paths.
lto = "thin"
codegen-units = 1
