[package]
name = "ib"
version = "0.1.0"
edition = "2021"
description = "Rust and Oracle simulation trading platform for paper trading and strategy development"

[dependencies]
argon2 = "0.5"
axum = "0.8"
oracle = "0.6"
rand_core = { version = "0.6", features = ["getrandom"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
rust_decimal = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
