name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend build dependencies
        # `include_str!` in src/web.rs embeds frontend/dist, so the backend
        # only compiles once the frontend has been built.
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --lib
      # tests/api.rs binds real sockets and opens SQLite files, so give it a
      # single job to keep port and file contention out of the picture.
      - name: Integration tests
        run: cargo test --test api

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Type-check and build
        run: npm run build
